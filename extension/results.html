<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Order History Export</title>
  <style>
    :root {
      --ink:#e6e1d8;
      --muted:#9a958c;
      --line:#333333;
      --bg:#121212;
      --card:#1c1c1c;
      --fill:#e6e1d8;
      --on-fill:#121212;
      --radius-sm: 4px;  /* chips, small buttons, inputs, report tabs */
      --radius-md: 6px;  /* format cards, tables, search, larger buttons */
    }
    html { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
    .brand {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px; background: #0c0c0c; color: #e6e1d8;
    }
    .brand .logo { height: 26px; width: auto; max-width: 240px; }
    .brand h1 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .brand .meta { color: #9a958c; font-size: 12px; letter-spacing: 0; text-transform: none; margin-left: auto; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 18px; background: #1c1c1c; border-bottom: 1px solid var(--line);
    }
    input[type="search"] {
      flex: 1; min-width: 180px; border: 1px solid var(--line); background: #121212; color: var(--ink);
      border-radius: var(--radius-md); padding: 8px 10px; font: inherit;
    }
    button {
      border: 1px solid var(--line); background: #1c1c1c; color: var(--ink); border-radius: var(--radius-md); padding: 8px 12px;
      font: inherit; font-weight: 650; font-size: 12px; cursor: pointer;
    }
    button.primary { background: var(--fill); color: var(--on-fill); border-color: var(--fill); }
    .wrap { padding: 0 18px 40px; overflow: auto; transition: opacity 160ms ease; }
    .wrap.is-fading { opacity: 0.35; transition: none; }
    table { border-collapse: collapse; width: 100%; background: #1c1c1c; margin-top: 0; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; max-width: 360px; }
    th { position: sticky; top: 0; background: #181818; color: var(--muted); cursor: pointer; white-space: nowrap; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; }
    td { word-break: break-word; transition: background 80ms ease; }
    tr:hover td { background: #222; }
    a { color: var(--ink); }
    .empty { padding: 40px 18px; color: var(--muted); }
    .totals {
      display: flex; flex-wrap: wrap; gap: 18px;
      padding: 10px 18px; background: #1c1c1c; border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    .totals b { font-variant-numeric: tabular-nums; }
    .totals span { color: var(--muted); }
    .report-tabs {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 18px;
      background: #1c1c1c;
      border-bottom: 1px solid var(--line);
    }
    .report-tabs.show { display: flex; }
    .report-tabs button {
      border: 1px solid var(--line);
      background: #1c1c1c;
      color: var(--ink);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font: inherit;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .report-tabs button.on {
      background: var(--fill);
      border-color: var(--fill);
      color: var(--on-fill);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .wrap.is-fading { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="brand">
    <img class="logo" src="brand/logo.svg" alt="517 Industries" />
    <h1>Order History Export</h1>
    <span class="meta" id="meta"></span>
  </div>
  <div class="report-tabs" id="reportTabs"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search this report" />
    <button class="primary" id="csv">Download CSV</button>
    <button id="json">Download JSON</button>
    <button id="copy">Copy</button>
  </div>
  <div class="totals" id="totals"></div>
  <div class="wrap" id="wrap"><p class="empty">No report yet. Open the extension and build one.</p></div>
  <script src="results.js"></script>
</body>
</html>
